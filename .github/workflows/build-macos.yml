name: Build macOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# новая сборка отменяет незаконченную предыдущую, чтобы релиз не перезаписала старая
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Временно Intel-сервер: у GitHub нет свободных macOS arm64-раннеров. Плагин собирается универсальным
    # (arm64 + x86_64), тесты и валидаторы проверяют x86_64-часть. Вернуть macos-15 (Apple Silicon), когда наладится.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # вся история и теги — для проверки приватности и релизов

      # Ничего личного в публичный репозиторий: почты, ключи, ссылки на переписку с ИИ
      - name: Privacy check
        run: bash scripts/privacy-check.sh

      # У каждой версии должен быть патчноут: docs/releases/<VERSION>.md
      - name: Release notes check
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -s "docs/releases/$VERSION.md" || { echo "::error::Нет патчноута docs/releases/$VERSION.md"; exit 1; }

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-src-8.0.10-${{ runner.os }}-${{ github.repository }}

      - name: Configure
        run: cmake -B build -G Xcode -DMIST_BUILD_TESTS=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build plugin (VST3 + AU)
        run: cmake --build build --config Release --target Mist_VST3 Mist_AU -- -quiet

      - name: Build and run render test
        run: |
          cmake --build build --config Release --target MistRenderTest -- -quiet
          ./build/MistRenderTest_artefacts/Release/MistRenderTest "$RUNNER_TEMP/render"

      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - build/Mist_artefacts/Release/VST3/Mist.vst3
          codesign --force --deep -s - build/Mist_artefacts/Release/AU/Mist.component

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
            --timeout-ms 600000 build/Mist_artefacts/Release/VST3/Mist.vst3

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Mist_artefacts/Release/AU/Mist.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Mist Prsn

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Mist_artefacts/Release/VST3/Mist.vst3 dist/
          cp -R build/Mist_artefacts/Release/AU/Mist.component dist/
          cp scripts/install-mac.sh dist/
          cp docs/Mist-manual.pdf dist/
          cp "$RUNNER_TEMP/render"/*.wav dist/ 2>/dev/null || true
          cd dist && zip -qry ../Mist-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Mist-macOS
          path: Mist-macOS.zip

      # Текущая версия: архив + патчноут. Постоянная ссылка:
      # https://github.com/controloptioncommand/Mist-vst/releases/latest/download/Mist-macOS.zip
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # имя релиза — из файла VERSION; повторная сборка той же версии обновляет релиз
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release delete "$VERSION" --cleanup-tag -y || true
          gh release create "$VERSION" Mist-macOS.zip \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --latest

      # Прошлые версии (v1 … v1.07): релизы только с патчноутом.
      # Тег ставится через API на настоящий коммит; если GitHub не разрешит (на старых коммитах другой файл
      # сборки, а токену сборки нельзя трогать workflow-файлы) — релиз привязывается к текущему коммиту,
      # а настоящий коммит указывается в тексте.
      - name: Publish notes for earlier versions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          grep -v '^#' docs/releases/tags.txt | while read -r TAG SHA; do
            [ -z "$TAG" ] && continue
            f="docs/releases/$TAG.md"
            [ -s "$f" ] || continue
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --title "$TAG" --notes-file "$f" --latest=false && echo "notes: $TAG"
              continue
            fi
            if gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null 2>&1; then
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$f" --latest=false && echo "release: $TAG @ $SHA"
            else
              { cat "$f"; printf '\n_Код этой версии: коммит %s._\n' "$SHA"; } > /tmp/notes.md
              gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes-file /tmp/notes.md --latest=false \
                && echo "release (current commit): $TAG, real commit $SHA"
            fi
          done
