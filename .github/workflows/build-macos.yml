name: Build macOS

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.10-${{ runner.os }}

      - name: Configure
        run: cmake -B build -G Xcode -DFERRITE_BUILD_TESTS=ON

      - name: Build plugin (VST3 + AU)
        run: cmake --build build --config Release --target Ferrite_VST3 Ferrite_AU -- -quiet

      - name: Build and run render test
        run: |
          cmake --build build --config Release --target FerriteRenderTest -- -quiet
          ./build/FerriteRenderTest_artefacts/Release/FerriteRenderTest "$RUNNER_TEMP/render"

      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - build/Ferrite_artefacts/Release/VST3/Ferrite.vst3
          codesign --force --deep -s - build/Ferrite_artefacts/Release/AU/Ferrite.component

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process \
            --timeout-ms 600000 build/Ferrite_artefacts/Release/VST3/Ferrite.vst3

      - name: Validate AU
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Ferrite_artefacts/Release/AU/Ferrite.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Frt1 Prsn

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/Ferrite_artefacts/Release/VST3/Ferrite.vst3 dist/
          cp -R build/Ferrite_artefacts/Release/AU/Ferrite.component dist/
          cp scripts/install-mac.sh dist/
          cp "$RUNNER_TEMP/render"/*.wav dist/ 2>/dev/null || true
          cd dist && zip -qry ../Ferrite-macOS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Ferrite-macOS
          path: Ferrite-macOS.zip
